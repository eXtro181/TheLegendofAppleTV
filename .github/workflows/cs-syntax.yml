name: C#-Syntax (Unity)
on:
  push:
    paths: ['unity/Assets/**/*.cs', '.github/tools/cscheck/**']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run --project .github/tools/cscheck -- unity/Assets
